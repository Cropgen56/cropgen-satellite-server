name: cropgen-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - rasterio
  - shapely
  - pyproj
  - gdal
  - proj
  - libgdal
  - pillow
  - matplotlib
  - python-dateutil
  - affine
  - pydantic>=2.5
  - pip:
    - fastapi
    - "uvicorn[standard]"
    - pystac-client
    - planetary-computer
    - python-dotenv
    - pytest
    - httpx
